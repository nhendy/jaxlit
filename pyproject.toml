[project]
name = "jaxlit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "absl-py>=2.5.0",
    "attrs>=26.1.0",
    "clu>=0.0.12",
    "eincheck>=0.6.3",
    "etils>=1.14.0",
    "flax>=0.12.9",
    "grain>=0.2.18",
    "gymnax>=1.0.1",
    "importlib-resources>=7.1.0",
    "ipdb>=0.13.13",
    "jax>=0.11.1",
    "jaxtyping>=0.3.4",
    "numpy>=2.5.2",
    "optax>=0.2.6",
    "orbax>=0.1.9",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "plotly>=7.1.0",
    "protobuf>=7.36.1",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "tabulate>=0.10.0",
    "tensorboard>=2.20.0",
    "wandb>=0.31.0",
]

[project.optional-dependencies]
viz = [
    "av2>=0.3.6",
    "kaleido>=1.4.0",
    "plotly>=7.1.0",
    "streamlit>=1.64.0",
]
gpu = [
    "jax[cuda12]==0.11.1 ; sys_platform == 'linux'",
]

[tool.pytest.ini_options]
# Test files live next to the code with no __init__.py, so pytest only puts
# their own directory on sys.path. Add the project root too, so a test can
# import its subject by package path (`from commmon.mlp import ...`).
pythonpath = ["."]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
# ruff's default rule set is E4,E7,E9,F -- F401 (unused imports) is already in
# it, but import sorting is not. `I` is isort; the editor's format action and
# `ruff check --fix` both act on it.
extend-select = ["I"]

[tool.ruff.format]
# Keep a magic trailing comma meaningful: when you leave a trailing comma after
# the last argument, ruff explodes the list one-per-line and keeps it that way.
# Without it, ruff packs as many args as fit onto the continuation line.
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
]

[tool.basedpyright]
include = ["core", "tasks"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# jax, flax, optax, clu and gymnax ship partial or no annotations; in strict
# mode every value they return would be flagged as "partially unknown". These
# report on third-party untypedness, not on our code.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportUntypedFunctionDecorator = false
reportUntypedClassDecorator = false
reportUntypedBaseClass = false
reportPrivateUsage = false
# Tests may use unannotated fixtures (`tmp_path`).
executionEnvironments = [{ root = "." }]
